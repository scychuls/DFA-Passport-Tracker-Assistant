<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DFA Passport Speed-Filing Helper & Slot Alarm</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1rem; max-width: 1100px; margin: 0 auto; line-height: 1.5; }
    
    header { background: var(--primary); color: white; padding: 1.25rem; border-radius: 12px; margin-bottom: 1.5rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    header p { font-size: 0.875rem; opacity: 0.9; }

    .control-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
    .timer-box { font-size: 1.1rem; font-weight: 600; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-decoration: none; display: inline-block; }
    .btn:hover { background: var(--primary-hover); }
    .btn-success { background: var(--accent); }
    .btn-success:hover { background: #16a34a; }
    .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.75rem; border-radius: 4px; }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 2px solid var(--border); }
    .tab-btn { background: none; border: none; padding: 0.75rem 1.25rem; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; background: var(--card-bg); padding: 1.25rem; border-radius: 12px; border: 1px solid var(--border); }
    .section-title { grid-column: 1 / -1; font-weight: 700; font-size: 1rem; margin-top: 0.5rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }

    .field-group { display: flex; flex-direction: column; gap: 0.25rem; }
    .field-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    .input-row { display: flex; gap: 0.5rem; }
    .input-row input, .input-row select { flex: 1; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.875rem; }
    .copy-btn { background: #e2e8f0; color: #334155; border: none; padding: 0 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: 600; transition: background 0.2s; }
    .copy-btn:hover { background: #cbd5e1; }
    .copy-btn.copied { background: #bbf7d0; color: #166534; }

    .action-bar { margin-top: 1rem; display: flex; justify-content: flex-end; gap: 1rem; }

    @media (max-width: 640px) {
      .control-panel { flex-direction: column; align-items: stretch; text-align: center; }
      .input-row { flex-direction: row; }
    }
  </style>
</head>
<body>

  <header>
    <h1>DFA Appointment Helper</h1>
    <p>Speed-filing Data Vault & Manual Refresh Alarm (3 Applicants)</p>
  </header>

  <section class="control-panel">
    <div class="timer-box">
      <span>Next DFA Refresh Alarm: </span>
      <strong id="timer-display">05:00</strong>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn" id="btn-sound-test">🔊 Test Alarm</button>
      <a href="https://www.passport.gov.ph/appointment" target="_blank" class="btn btn-success">🔗 Open DFA Portal</a>
    </div>
  </section>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(1)">Applicant 1</button>
    <button class="tab-btn" onclick="switchTab(2)">Applicant 2</button>
    <button class="tab-btn" onclick="switchTab(3)">Applicant 3</button>
  </div>

  <!-- APPLICANT FORM TEMPLATE -->
  <div id="forms-container"></div>

  <div class="action-bar">
    <button class="btn btn-success" onclick="saveAllData()">💾 Save All Data to Browser</button>
  </div>

  <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    // Config & Timer Logic
    let countdown = 300; // 5 minutes interval
    const timerDisplay = document.getElementById('timer-display');
    const alarmSound = document.getElementById('alarm-sound');

    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        triggerAlarm();
        countdown = 300;
      }
      const mins = String(Math.floor(countdown / 60)).padStart(2, '0');
      const secs = String(countdown % 60).padStart(2, '0');
      timerDisplay.textContent = `${mins}:${secs}`;
    }, 1000);

    function triggerAlarm() {
      alarmSound.play();
      if (Notification.permission === "granted") {
        new Notification("DFA Slot Reminder!", { body: "Time to refresh the DFA portal to check for open slots." });
      }
    }

    document.getElementById('btn-sound-test').addEventListener('click', () => {
      alarmSound.play();
      if (Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    });

    function switchTab(index) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index - 1);
      });
      document.querySelectorAll('.tab-content').forEach((content, i) => {
        content.classList.toggle('active', i === index - 1);
      });
    }

    // Form Schema aligned with official DFA fields
    const fieldsSchema = [
      { section: "Personal Information" },
      { id: "mobile", label: "Mobile Number" },
      { id: "email", label: "Email Address" },
      { id: "lastname", label: "Last Name" },
      { id: "givenname", label: "Given Name" },
      { id: "middlename", label: "Middle Name" },
      { id: "dob", label: "Date of Birth (MM/DD/YYYY)" },
      { id: "gender", label: "Gender (Male/Female)" },
      { id: "civil_status", label: "Civil Status" },
      { id: "birth_legitimacy", label: "Birth Legitimacy" },
      { id: "province_birth", label: "Province of Birth" },
      { id: "city_birth", label: "City/Municipality of Birth" },

      { section: "Parents Information" },
      { id: "father_lastname", label: "Father Last Name" },
      { id: "father_givenname", label: "Father Given Name" },
      { id: "father_middlename", label: "Father Middle Name" },
      { id: "mother_lastname", label: "Mother Maiden Last Name" },
      { id: "mother_givenname", label: "Mother Given Name" },
      { id: "mother_middlename", label: "Mother Maiden Middle Name" },

      { section: "Application & Emergency Details" },
      { id: "app_type", label: "Application Type (NEW/RENEWAL)" },
      { id: "citizenship_basis", label: "Basis of Citizenship (BIRTH)" },
      { id: "emergency_contact", label: "Emergency Contact Person" },
      { id: "emergency_number", label: "Emergency Contact Number" },

      { section: "Address & Occupation" },
      { id: "address", label: "Current Address" },
      { id: "city", label: "City" },
      { id: "province", label: "Province / State" },
      { id: "occupation", label: "Occupation" }
    ];

    // Render Forms for 3 Applicants
    const container = document.getElementById('forms-container');
    for (let appNum = 1; appNum <= 3; appNum++) {
      const tabDiv = document.createElement('div');
      tabDiv.className = `tab-content ${appNum === 1 ? 'active' : ''}`;
      tabDiv.id = `app-${appNum}`;

      const gridDiv = document.createElement('div');
      gridDiv.className = 'form-grid';

      fieldsSchema.forEach(item => {
        if (item.section) {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-title';
          titleDiv.textContent = item.section;
          gridDiv.appendChild(titleDiv);
        } else {
          const fieldGroup = document.createElement('div');
          fieldGroup.className = 'field-group';
          const inputId = `app${appNum}_${item.id}`;

          fieldGroup.innerHTML = `
            <label for="${inputId}">${item.label}</label>
            <div class="input-row">
              <input type="text" id="${inputId}" placeholder="Enter ${item.label}">
              <button class="copy-btn" onclick="copyValue('${inputId}', this)">Copy</button>
            </div>
          `;
          gridDiv.appendChild(fieldGroup);
        }
      });

      tabDiv.appendChild(gridDiv);
      container.appendChild(tabDiv);
    }

    // Helper functions for copying and storage
    function copyValue(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.value) {
        navigator.clipboard.writeText(input.value);
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1200);
      }
    }

    function saveAllData() {
      const inputs = document.querySelectorAll('input[id^="app"]');
      inputs.forEach(input => {
        localStorage.setItem(input.id, input.value);
      });
      alert('All applicant details saved locally in your browser!');
    }

    function loadSavedData() {
      const inputs = document.querySelectorAll('input[id^="app"]');
      inputs.forEach(input => {
        const saved = localStorage.getItem(input.id);
        if (saved) input.value = saved;
      });
    }

    // Load data on start
    window.onload = loadSavedData;
  </script>
</body>
</html>
